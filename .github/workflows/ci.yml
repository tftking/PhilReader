name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # The newest Xcode 26 on the runner, for the iOS 26 SDK (Liquid Glass tab and navigation bars).
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber)) | .[] | .value[] | select(.name | startswith("iPhone"))] | (map(select(.name | test("Pro$"))) | last) // last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PhilReader.xcodeproj \
            -scheme PhilReader \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE_ID: com.philreader.app
        run: |
          set -euo pipefail
          mkdir -p screenshots/comics
          swiftc -O Scripts/make-sample-cbz.swift -o "$RUNNER_TEMP/make-sample-cbz"
          sample() { "$RUNNER_TEMP/make-sample-cbz" "screenshots/comics/$1" "${@:2}"; }
          sample "Starfall 1.cbz" --series Starfall --number 1 --title "First Light" --hue 0.60 --pages 12
          sample "Starfall 2.cbz" --series Starfall --number 2 --title "Dark Water" --hue 0.52 --pages 10
          sample "Midnight Ramen 1.cb7" --series "Midnight Ramen" --number 1 --title "Open Late" --hue 0.07 --pages 12 --format cb7
          sample "Paper Tigers 1.pdf" --series "Paper Tigers" --number 1 --title "Crease" --hue 0.97 --pages 8 --format pdf
          sample "Moonlit 1" --series Moonlit --number 1 --title "Tides" --hue 0.78 --pages 9 --format folder
          sample "Moonlit 2.epub" --series Moonlit --number 2 --title "Undertow" --hue 0.70 --pages 8 --format epub
          # A folder linked as a library folder, standing in for one in iCloud Drive.
          mkdir -p screenshots/comics/Shelf
          sample "Shelf/Night Market 1.cbz" --series "Night Market" --number 1 --title "Lanterns" --hue 0.13 --pages 8
          sample "Shelf/Night Market 2.cbz" --series "Night Market" --number 2 --title "Smoke" --hue 0.88 --pages 8

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" DerivedData/Build/Products/Debug-iphonesimulator/PhilReader.app

          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA/Documents"
          cp -R screenshots/comics/. "$DATA/Documents/"

          PROGRESS="Starfall 2=4;Midnight Ramen 1=7;Paper Tigers 1=3;Starfall 1=12;Moonlit 1=9"
          shoot() {
            local name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoLibrary YES -demoCollections YES -demoLinkFolder Shelf -demoProgress "$PROGRESS" "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          # Warm-up launch: the first run imports the demo library, which is slow on CI.
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoLibrary YES -demoCollections YES -demoLinkFolder Shelf -demoProgress "$PROGRESS"
          sleep 25
          shoot 1-reading-now
          shoot 2-details -demoInfo "Starfall 2"
          shoot 3-reader-cover -demoOpen "Midnight Ramen 1" -demoPage 1 -demoChrome visible
          shoot 4-reader-controls -demoOpen "Starfall 2" -demoPage 4 -demoChrome visible
          shoot 5-reader-page -demoOpen "Starfall 2" -demoPage 5 -demoChrome hidden
          shoot 6-page-browser -demoOpen "Starfall 2" -demoPage 4 -demoSheet pages
          shoot 7-reader-settings -demoOpen "Starfall 2" -demoPage 4 -demoSheet settings
          shoot 8-vertical-scroll -demoOpen "Moonlit 1" -demoMode vertical -demoPage 2 -demoChrome visible
          shoot 9-end-of-comic -demoOpen "Starfall 1" -demoEnd YES -demoChrome hidden
          shoot 10-pdf -demoOpen "Paper Tigers 1" -demoMode paged -demoPage 2 -demoChrome visible
          shoot 11-collection -demoCollection "Favourites"
          shoot 12-series -demoSeries "Starfall"
          shoot 13-list-layout -demoScope all -library.layout list
          shoot 14-select -demoSelect "Starfall 1,Moonlit 1"
          shoot 15-library -demoTab library
          shoot 16-settings -demoTab settings
          shoot 17-guided-view -demoOpen "Starfall 2" -demoMode paged -demoPage 3 -demoChrome visible -reader.guided YES
          shoot 18-epub -demoOpen "Moonlit 2" -demoMode paged -demoPage 2 -demoChrome visible -reader.guided NO
          shoot 19-all-comics -demoScope all -library.layout grid
          shoot 20-search -demoTab search -demoSearch "moon"
          shoot 21-readers-settings -demoTab settings -demoSettings readers
          shoot 22-reader-scrub -demoOpen "Starfall 1" -demoMode paged -demoPage 6 -demoChrome visible -demoScrub YES
          shoot 23-gestures -demoTab settings -demoSettings gestures
          shoot 24-filters -demoTab settings -demoSettings filters -demoTone sepia
          shoot 25-presets -demoTab settings -demoSettings presets
          shoot 26-reader-sepia -demoOpen "Starfall 2" -demoMode paged -demoPage 5 -demoChrome hidden -demoTone sepia
          shoot 27-avoid-margins -demoOpen "Starfall 2" -demoMode paged -demoPage 5 -demoChrome hidden -reader.avoidMargins YES

          # Web server: open it in the app, then upload from this machine as a computer's browser would.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoLibrary YES -demoCollections YES -demoLinkFolder Shelf -demoProgress "$PROGRESS" -demoWebServer YES
          sleep 8
          "$RUNNER_TEMP/make-sample-cbz" "$RUNNER_TEMP/Night Owl 1.cbz" --series "Night Owl" --number 1 --title "Wide Awake" --hue 0.45 --pages 6
          echo "GET /:"; curl -sS -m 10 http://127.0.0.1:8080/ | head -c 120 || echo "GET failed"; echo
          echo "Upload:"; curl -sS -m 60 -H "X-File-Name: Night%20Owl%201.cbz" --data-binary "@$RUNNER_TEMP/Night Owl 1.cbz" http://127.0.0.1:8080/upload || echo "upload failed"; echo
          echo "Unsupported upload:"; curl -sS -m 10 -H "X-File-Name: notes.txt" --data-binary "hello" http://127.0.0.1:8080/upload || echo "request failed"; echo
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/28-web-server.png
          shoot 29-after-upload -demoScope all

      - name: Print screenshot previews
        # Small JPEGs as base64 in the log, for reviewing the UI where artifact downloads aren't available.
        if: always()
        run: |
          shopt -s nullglob
          for f in screenshots/*.png; do
            name=$(basename "$f" .png)
            sips -Z 900 -s format jpeg -s formatOptions 55 "$f" --out "$RUNNER_TEMP/$name.jpg" >/dev/null
            echo "@@SHOT $name"
            base64 -i "$RUNNER_TEMP/$name.jpg" | tr -d '\n' | fold -w 6000
            echo
            echo "@@END $name"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
