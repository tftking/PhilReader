name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | (map(select(.name | test("Pro$"))) | last) // last | .udid')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PhilReader.xcodeproj \
            -scheme PhilReader \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE_ID: com.philreader.app
          COMIC: Sample Manga.cbz
        run: |
          set -euo pipefail
          mkdir -p screenshots
          swift Scripts/make-sample-cbz.swift "screenshots/$COMIC"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" DerivedData/Build/Products/Debug-iphonesimulator/PhilReader.app

          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$DATA/Documents"
          cp "screenshots/$COMIC" "$DATA/Documents/"

          shoot() {
            local name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoComic "$COMIC" "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 1-library
          shoot 2-reader-cover -demoOpenReader YES -demoPage 1 -demoChrome visible
          shoot 3-reader-controls -demoOpenReader YES -demoPage 3 -demoChrome visible
          shoot 4-reader-page -demoOpenReader YES -demoPage 4 -demoChrome hidden

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
